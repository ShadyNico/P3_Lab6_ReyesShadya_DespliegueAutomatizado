name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  frontend:
    name: Validar frontend
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependencias
        run: npm install

      - name: Analizar código
        run: npm run lint

      - name: Construir PWA
        run: npm run build

  backend:
    name: Validar backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas
        run: npm test

  docker:
    name: Construir imágenes Docker
    runs-on: ubuntu-latest
    needs:
      - frontend
      - backend
    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagen del frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: portal-pwa-frontend:ci

      - name: Construir imagen del backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: portal-pwa-backend:ci

  publish:
    name: Publicar imágenes en Docker Hub
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs:
      - docker
    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Publicar imagen del frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/portal-pwa-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/portal-pwa-frontend:${{ github.sha }}

      - name: Publicar imagen del backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/portal-pwa-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/portal-pwa-backend:${{ github.sha }}
